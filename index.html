<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Gestor Académico</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🎓</div>
      <div class="auth-logo-text">GestorAcadémico</div>
    </div>
    <h1 class="auth-title">Bienvenido de vuelta</h1>
    <p class="auth-subtitle">Inicia sesión para continuar</p>

    <div id="errorMsg" class="error-msg"></div>

    <form id="formLogin">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="correo@ejemplo.com" required/>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:20px">Iniciar sesión →</button>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta? <a href="registro.html">Registrarse</a>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>initLogin();</script>
</body>
</html>
