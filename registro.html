<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro — Gestor Académico</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-logo">
      <div class="auth-logo-icon">🎓</div>
      <div class="auth-logo-text">GestorAcadémico</div>
    </div>
    <h1 class="auth-title">Crear cuenta</h1>
    <p class="auth-subtitle">Ingresa tus datos para registrarte</p>

    <div id="errorMsg" class="error-msg"></div>

    <form id="formRegistro">
      <div class="form-grid">
        <div class="field">
          <label for="nombres">Nombres *</label>
          <input type="text" id="nombres" placeholder="Ej: Juan Carlos" required/>
        </div>
        <div class="field">
          <label for="apellidos">Apellidos *</label>
          <input type="text" id="apellidos" placeholder="Ej: García López" required/>
        </div>
        <div class="field">
          <label for="correo">Correo electrónico *</label>
          <input type="email" id="correo" placeholder="correo@ejemplo.com" required/>
        </div>
        <div class="field">
          <label for="dni">DNI *</label>
          <input type="text" id="dni" placeholder="12345678" maxlength="8" required/>
        </div>
        <div class="field full">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required/>
        </div>
        <div class="field">
          <label for="carrera">Carrera *</label>
          <input type="text" id="carrera" placeholder="Ej: Ingeniería de Sistemas" required/>
        </div>
        <div class="field">
          <label for="ciclo">Ciclo académico *</label>
          <select id="ciclo" required>
            <option value="">Seleccionar ciclo</option>
            <option>I</option><option>II</option><option>III</option>
            <option>IV</option><option>V</option><option>VI</option>
            <option>VII</option><option>VIII</option><option>IX</option><option>X</option>
          </select>
        </div>
        <div class="field full">
          <label for="ciudad">Ciudad *</label>
          <input type="text" id="ciudad" placeholder="Ej: Lima" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Crear cuenta →</button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>initRegistro();</script>
</body>
</html>
